services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: busconductor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/busconductor
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      JWT_REFRESH_SECRET_KEY: dev-refresh-key-change-in-production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

volumes:
  pgdata:
